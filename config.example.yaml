# The loader intentionally supports a small, dependency-free YAML subset:
# top-level key/value pairs, JSON-style lists, and | block strings.
model: gpt-4.1-mini
api_base: https://api.openai.com/v1
api_key_env: OPENAI_API_KEY
temperature: 0.0
timeout_seconds: 60
max_retries: 2

category: THREATEN
event_type: Violence
allowed_event_types: ["Territory", null, "Arrest", "Relations", "Expel", "Violence", "Restrict"]
category_description: |
  Communicate an adverse consequence directed at a target, conditionally or
  unconditionally, to intimidate or compel. The communication has occurred;
  the threatened action need not occur. A demand without an adverse consequence,
  hostile commentary, risk forecast, or announcement of military plans alone is
  insufficient.
event_type_description: |
  Threaten physical violence; hostile language alone is insufficient.

sentence_split_pattern: "(?<=[.!?])\\s+|\\n+"
system_prompt: |
  You are a precise Plover event extraction system. Use only explicit evidence
  and return valid JSON.
user_prompt_template: |
  TASK
  Find every distinct event in SENTENCES that satisfies both TARGET_CATEGORY and
  TARGET_EVENT_TYPE. Use the definitions below, not keyword matching alone.

  EXTRACTION RULES
  1. actor_text is the exact text span for the entity performing or communicating
  the event. recipient_text is the exact text span for its target.
  2. Copy actor_text and recipient_text verbatim from SENTENCES; never infer an
  unstated entity. If either role is not explicit, do not emit that event.
  3. evidence_sentence_ids contains every and only sentence needed to establish
  the actor, recipient, and event. Use only IDs present in SENTENCES.
  4. Emit separate array items for distinct event mentions. Do not duplicate one
  event merely because it has multiple evidence sentences.
  5. Ignore events belonging to another Plover category/type. Return an empty
  events array when no matching event is explicit.

  OUTPUT CONTRACT
  Return JSON only, with exactly this shape (no markdown or extra keys):
  {"events":[{"actor_text":"exact source span","recipient_text":"exact source span","evidence_sentence_ids":["s1"]}]}
  The pipeline adds fixed fields to produce this public item schema:
  {"doc_id":"document id","mention_id":"m1","actor_text":"exact source span","recipient_text":"exact source span","category":"configured category","event_type":"configured event type or null","evidence_sentence_ids":["s1"]}

  DOCUMENT_ID: $doc_id
  TARGET_CATEGORY: $category
  CATEGORY_DEFINITION: $category_description
  TARGET_EVENT_TYPE: $event_type
  EVENT_TYPE_DEFINITION: $event_type_description
  SENTENCES: $sentences
