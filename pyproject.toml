[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plover-extraction"
version = "0.1.0"
description = "Schemas and ontology helpers for Plover event extraction"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
plover-extract = "plover_extraction.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
